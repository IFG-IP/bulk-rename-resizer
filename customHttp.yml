customHeaders:
  - pattern: '**'
    headers:
      # heic2any（libheif の Emscripten ビルド）が new Function を使うため 'unsafe-eval'、変換ワーカーが blob: のため worker-src blob:
      # manual.html / privacy.html の <style> と React の動的スタイルのため style-src に 'unsafe-inline'
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' data: blob: https://sheets.googleapis.com https://firestore.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
      - key: X-Frame-Options
        value: DENY
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Strict-Transport-Security
        value: max-age=31536000
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
